{% extends "base.html" %}
{% block title %}Edit Marks{% endblock %}
{% block content %}<div class="page-head"><div><div class="eyebrow">RECORD MANAGEMENT</div><h1>Edit Marks</h1><p>Update the existing marks record.</p></div></div><div class="card"><form method="POST" class="form-grid"><select name="student" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.name }}" {% if s.name == mark.student %}selected{% endif %}>{{ s.name }} — Roll {{ s.roll }}</option>{% endfor %}</select><input name="subject" value="{{ mark.subject }}" placeholder="Subject" required><input name="marks" type="number" min="0" value="{{ mark.marks }}" placeholder="Marks obtained" required><input name="max_marks" type="number" min="1" value="{{ mark.max_marks }}" placeholder="Maximum marks"><div class="form-actions"><button class="btn primary" type="submit">Save Changes</button><a class="btn" href="{{ url_for('marks') }}">Cancel</a></div></form></div>{% endblock %}
