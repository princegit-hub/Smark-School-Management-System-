{% extends "base.html" %}
{% block title %}Edit Fee{% endblock %}
{% block content %}<div class="page-head"><div><div class="eyebrow">RECORD MANAGEMENT</div><h1>Edit Fee Record</h1><p>Update the existing fee record.</p></div></div><div class="card"><form method="POST" class="form-grid"><select name="student" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.name }}" {% if s.name == fee.student %}selected{% endif %}>{{ s.name }} — Roll {{ s.roll }}</option>{% endfor %}</select><input name="amount" type="number" step="0.01" min="0" value="{{ fee.amount }}" placeholder="Amount" required><input name="month" value="{{ fee.month }}" placeholder="Month / Term"><select name="status"><option {% if fee.status == 'Pending' %}selected{% endif %}>Pending</option><option {% if fee.status == 'Paid' %}selected{% endif %}>Paid</option></select><div class="form-actions"><button class="btn primary" type="submit">Save Changes</button><a class="btn" href="{{ url_for('fees') }}">Cancel</a></div></form></div>{% endblock %}
