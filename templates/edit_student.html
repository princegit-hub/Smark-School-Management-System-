{% extends "base.html" %}
{% block title %}Edit Student{% endblock %}
{% block content %}<div class="page-head"><div><div class="eyebrow">RECORD MANAGEMENT</div><h1>Edit Student</h1><p>Update the existing student record.</p></div></div><div class="card"><form method="POST" class="form-grid"><input name="name" value="{{ student.name }}" placeholder="Full name" required><input name="roll" value="{{ student.roll }}" placeholder="Roll number" required><input name="class" value="{{ student['class'] }}" placeholder="Class" required><input name="section" value="{{ student.section }}" placeholder="Section"><input name="gender" value="{{ student.gender }}" placeholder="Gender"><input name="phone" value="{{ student.phone }}" placeholder="Phone"><input name="email" type="email" value="{{ student.email }}" placeholder="Email"><div class="form-actions"><button class="btn primary" type="submit">Save Changes</button><a class="btn" href="{{ url_for('students') }}">Cancel</a></div></form></div>{% endblock %}
