{% extends "base.html" %}
{% block title %}Edit Attendance{% endblock %}
{% block content %}<div class="page-head"><div><div class="eyebrow">RECORD MANAGEMENT</div><h1>Edit Attendance</h1><p>Update the existing attendance record.</p></div></div><div class="card"><form method="POST" class="form-grid"><select name="student" required><option value="">Select student</option>{% for s in students %}<option value="{{ s.name }}" {% if s.name == record.student %}selected{% endif %}>{{ s.name }} — Roll {{ s.roll }}</option>{% endfor %}</select><input type="date" name="date" value="{{ record.date }}" required><select name="status"><option {% if record.status == 'Present' %}selected{% endif %}>Present</option><option {% if record.status == 'Absent' %}selected{% endif %}>Absent</option><option {% if record.status == 'Late' %}selected{% endif %}>Late</option></select><div class="form-actions"><button class="btn primary" type="submit">Save Changes</button><a class="btn" href="{{ url_for('attendance') }}">Cancel</a></div></form></div>{% endblock %}
