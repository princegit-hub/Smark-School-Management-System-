{% extends "base.html" %}
{% block title %}Edit Teacher{% endblock %}
{% block content %}<div class="page-head"><div><div class="eyebrow">RECORD MANAGEMENT</div><h1>Edit Teacher</h1><p>Update the existing teacher record.</p></div></div><div class="card"><form method="POST" class="form-grid"><input name="name" value="{{ teacher.name }}" placeholder="Teacher name" required><input name="subject" value="{{ teacher.subject }}" placeholder="Subject"><input name="department" value="{{ teacher.department }}" placeholder="Department"><input name="phone" value="{{ teacher.phone }}" placeholder="Phone"><input name="email" type="email" value="{{ teacher.email }}" placeholder="Email"><div class="form-actions"><button class="btn primary" type="submit">Save Changes</button><a class="btn" href="{{ url_for('teachers') }}">Cancel</a></div></form></div>{% endblock %}
